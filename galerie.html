
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Editorial Galerie | NyraAmanda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #684583;
      --muted: #826d91;
      --bg: #faf7fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--purple);
      font-family: "DM Sans", sans-serif;
    }

    header {
      background: linear-gradient(135deg, #eee1f7, #d9c3eb, #c6a8dd);
      padding: 25px 5% 75px;
    }

    nav {
      max-width: 1300px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hero {
      text-align: center;
      margin: 85px auto 0;
      max-width: 850px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1, h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
    }

    h1 {
      font-size: clamp(55px, 10vw, 120px);
      line-height: .95;
      margin: 22px 0;
    }

    .hero p {
      font-size: 13px;
      line-height: 1.9;
      max-width: 550px;
      margin: 25px auto 0;
    }

    .intro {
      text-align: center;
      padding: 65px 5% 35px;
    }

    .intro h2 {
      font-size: clamp(35px, 5vw, 65px);
      margin: 10px 0;
    }

    .gallery {
      max-width: 1450px;
      margin: auto;
      padding: 10px 4% 90px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      min-width: 0;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(90, 50, 115, .07);
    }

    .preview {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: linear-gradient(145deg, #e8d7ce, #c5add2, #947bac);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 22px;
    }

    .number {
      font-size: 10px;
      font-weight: 700;
      color: #977cac;
    }

    .card h2 {
      font-size: 32px;
      margin: 12px 0;
      line-height: 1.1;
    }

    button {
      width: 100%;
      cursor: pointer;
      padding: 13px 5px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
    }

    .show {
      border: 1px solid var(--purple);
      color: var(--purple);
      background: white;
      margin-top: 10px;
    }

    .copy {
      border: 1px solid var(--purple);
      color: white;
      background: var(--purple);
      margin-top: 8px;
    }

    .prompt {
      display: none;
      background: #f5edf9;
      color: #675573;
      padding: 15px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .prompt.open {
      display: block;
    }

    .status {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 40px 15px;
      background: #f0e5f7;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 650px) {
      header {
        padding: 20px 5% 55px;
      }

      .hero {
        margin-top: 65px;
      }

      .intro {
        padding: 45px 4% 25px;
      }

      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 10px 3% 60px;
      }

      .card-body {
        padding: 8px;
      }

      .card h2 {
        font-size: 18px;
      }

      .number, .preview {
        font-size: 8px;
      }

      button {
        font-size: 9px;
        padding: 10px 2px;
        overflow-wrap: anywhere;
      }

      .prompt {
        padding: 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="index.html">NYRAAMANDA</a>
      <a href="nature-outdoor.html">← ZURÜCK</a>
    </nav>

    <div class="hero">
      <div class="eyebrow" id="category">
        EDITORIAL COLLECTION
      </div>

      <h1 id="title">Editorial Galerie</h1>

      <p id="description">
        Entdecke deine Editorial-Bildwelt.
      </p>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="eyebrow">EDITORIAL PROMPT LIBRARY</div>
      <h2>Die Galerie</h2>
      <p>
        Bilder entdecken · Prompts ansehen · Prompts kopieren
      </p>
    </section>

    <div id="status" class="status">
      Galerie wird geladen …
    </div>

    <section id="gallery" class="gallery"></section>
  </main>

  <footer>
    NYRAAMANDA · EDITORIAL PROMPT LIBRARY
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const collectionId = params.get("serie") || "mediteran-dreams";

    const gallery = document.getElementById("gallery");
    const status = document.getElementById("status");

    async function loadGallery() {
      try {
        const response = await fetch("editorials.json");

        if (!response.ok) {
          throw new Error("Inhaltsliste nicht gefunden");
        }

        const data = await response.json();

        const collection = data.collections.find(
          item => item.id === collectionId
        );

        if (!collection) {
          status.textContent =
            "Diese Editorial-Serie wurde nicht gefunden.";
          return;
        }

        document.title = collection.title + " | NyraAmanda";

        document.getElementById("title").textContent =
          collection.title;

        document.getElementById("category").textContent =
          collection.category || "EDITORIAL COLLECTION";

        document.getElementById("description").textContent =
          collection.description || "";

        status.style.display = "none";

        collection.items.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "card";

          const preview = document.createElement("div");
          preview.className = "preview";

          if (item.image) {
            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.title || "Editorial Bild";
            img.loading = "lazy";
            preview.appendChild(img);
          } else {
            preview.textContent =
              "BILD " + String(index + 1).padStart(2, "0");
          }

          const body = document.createElement("div");
          body.className = "card-body";

          const number = document.createElement("div");
          number.className = "number";
          number.textContent =
            "EDITORIAL " + String(index + 1).padStart(2, "0");

          const heading = document.createElement("h2");
          heading.textContent = item.title || "Editorial";

          const showButton = document.createElement("button");
          showButton.className = "show";
          showButton.textContent = "PROMPT ANSEHEN";
          showButton.setAttribute("aria-expanded", "false");

          const prompt = document.createElement("div");
          prompt.className = "prompt";
          prompt.textContent = item.prompt || "";

          showButton.addEventListener("click", () => {
            const isOpen = prompt.classList.toggle("open");

            showButton.textContent = isOpen
              ? "PROMPT VERBERGEN"
              : "PROMPT ANSEHEN";

            showButton.setAttribute(
              "aria-expanded",
              String(isOpen)
            );
          });

          const copyButton = document.createElement("button");
          copyButton.className = "copy";
          copyButton.textContent = "PROMPT KOPIEREN";

          copyButton.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(item.prompt || "");
              copyButton.textContent = "KOPIERT ✓";
            } catch (error) {
              copyButton.textContent =
                "KOPIEREN NICHT MÖGLICH";
            }

            setTimeout(() => {
              copyButton.textContent = "PROMPT KOPIEREN";
            }, 2000);
          });

          body.append(
            number,
            heading,
            showButton,
            prompt,
            copyButton
          );

          card.append(preview, body);
          gallery.appendChild(card);
        });

      } catch (error) {
        status.textContent =
          "Die Inhaltsliste ist noch nicht eingerichtet.";
      }
    }

    loadGallery();
  </script>

</body>
</html>
